name: music_app
description: A modern music listening app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  just_audio: ^0.9.41
  audio_session: ^0.1.20
  supabase_flutter: ^2.6.0
  flutter_secure_storage: ^10.0.0
  drift: ^2.32.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.2.2
  sqlite3: ^3.1.6
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  sqflite: ^2.4.2
  dio: ^5.9.2
  connectivity_plus: ^7.0.0
  animated_text_kit: ^4.3.0
  just_waveform: ^0.0.7
  rive: ^0.13.1
  flutter_shader_kit: ^0.1.1

  uuid: any
  flutter_colorpicker: ^1.1.0
  flex_color_picker: ^3.8.0
  just_audio_media_kit: ^2.1.0
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  window_manager: ^0.5.1
  flutter_code_editor: ^0.3.5
  lua_dardo: ^0.0.5
  flutter_tilt: ^3.3.2
  flutter_form_builder: ^10.3.0+2
  file_picker: ^10.3.10
  flutter_markdown: ^0.7.7+1
  archive: ^4.0.9
  multi_split_view: ^3.6.1
  nested: any
  collection: any
  flutter_highlight: any
  highlight: any
  cyclop: ^0.7.0
  pasteboard: ^0.5.0
dev_dependencies:
  build_runner: ^2.11.1
  drift_dev: ^2.32.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/lyrics/

  shaders:
    - assets/shaders/cool_ocean_wave.frag
    - assets/shaders/bg_gradient.frag
    - assets/shaders/bg_kaleidoscope.frag
    - assets/shaders/audio_ring.frag
    - assets/shaders/fire.frag
    - assets/shaders/vignette.frag

  fonts:
    - family: Clearface
      fonts:
        - asset: assets/fonts/Clearface ITC BQ Regular.ttf
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700

dependency_overrides:
  just_audio_media_kit:
    path: packages/just_audio_media_kit
